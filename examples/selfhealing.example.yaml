# HealOps example configuration. Copy this to selfhealing.yaml and adjust it.
# Safe by default: with dry_run true, proposed actions are only logged.
dry_run: true
check_interval_seconds: 30

# An action the policy would run automatically ("allow") needs a person's
# approval instead when the agent's confidence is below this value (0 to 1).
# Confidence can only hold an action back, never grant permission.
min_confidence_for_auto: 0.6


# How long an action waits for a person to approve it. After that the incident
# is escalated; an action is never approved automatically.
approval_timeout_seconds: 3600

# Where HealOps writes its audit trail and remembers its state (observations, incidents,
# approvals waiting for a person). Use null to keep them in memory only.
audit_log_path: healops_audit.jsonl
state_db_path: healops_state.db
state_retention_days: 30

# Time limits for calls into your application's adapter. A call that takes longer is
# treated as failed; an action that times out is escalated to a person, never retried.
# After max_stuck_calls hung calls, the application is treated as unresponsive.
adapter_timeouts:
  read_seconds: 10      # health, metrics, drift
  action_seconds: 120   # restart, reload, rollback, retraining
  max_stuck_calls: 3

# An incident is created when a value crosses its limit.
# Remove a line to stop monitoring that value.
thresholds:
  latency_ms: 500
  error_rate: 0.05
  drift_score: 0.3
  # A value must cross its limit this many checks in a row before an incident
  # is created, so one odd reading does not raise a false alarm.
  consecutive_breaches: 3

# Normal level of the model-quality metrics your application reports.
# higher_is_better: true  -> a drop of more than max_change is a problem
# higher_is_better: false -> a rise of more than max_change is a problem
metric_degradation:
  f1_score:
    baseline: 0.90
    max_change: 0.10
    higher_is_better: true

# --- llm (optional) ---
# Let a language model suggest diagnoses. Leave this section out to use the
# built-in rules only. The model only PROPOSES; the policy still decides, and
# if the model fails or gives an unusable answer, the rules take over.
# provider: ollama | openai | anthropic | openai_compatible
# api_key_env is the NAME of an environment variable holding the key, never the
# key itself. A local Ollama model needs no key.
# llm:
#   provider: ollama
#   model: llama3.2:3b
#   # base_url: http://localhost:11434
#   # api_key_env: OPENAI_API_KEY
#   # timeout_seconds: 120
#   #
#   # Any other OpenAI-style service (an example, check its own documentation):
#   # provider: openai_compatible
#   # base_url: https://generativelanguage.googleapis.com
#   # chat_path: /v1beta/openai/chat/completions
#   # api_key_env: GEMINI_API_KEY
#   # json_mode: false
#   max_confidence: 0.9
#   # At most this many model calls per hour; after that the rules answer instead.
#   # Use null to switch the limit off.
#   max_calls_per_hour: 20
#   use_fallback: true
# --- end llm ---

# After an action, HealOps watches the application before calling it recovered.
# It waits settle_seconds, then checks "checks" times, interval_seconds apart.
# The whole wait must fit inside max_window_seconds.
verification:
  settle_seconds: 10
  checks: 3
  interval_seconds: 10
  max_window_seconds: 300
  
  
# Used for any action that is not listed under "policies".
default_policy:
  verdict: needs_approval
  max_retries: 1
  cooldown_seconds: 300

# verdict is one of: allow, needs_approval, deny
policies:
  reload_model:
    verdict: allow
    max_retries: 2
    cooldown_seconds: 300
  rollback_model:
    verdict: needs_approval
  request_retraining:
    verdict: needs_approval
  request_redeployment:
    verdict: deny