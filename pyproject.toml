[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healops"
version = "0.1.0"
description = "Reusable, model-agnostic framework for detecting, diagnosing and recovering ML applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]